<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="The Shaggy vs Goku comment-section moment.">
  <title>Shaggy vs Goku</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 0%, #183018 0, #101010 38rem, #080808 75%); color: #f5f5f5; }
    main { width: min(100% - 32px, 760px); margin: 0 auto; padding: 52px 0 64px; text-align: center; }
    .eyebrow { color: #9be879; font-size: .76rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.05; }
    p { margin: 0 auto 28px; max-width: 36rem; color: #bcbcbc; line-height: 1.6; }
    figure { margin: 0 auto; width: min(100%, 355px); padding: 9px; border: 1px solid #343434; border-radius: 22px; background: #151515; box-shadow: 0 22px 80px #000a, 0 0 36px #62ff3420; }
    img { display: block; width: 100%; height: auto; border-radius: 14px; }
    figcaption { padding: 12px 4px 4px; color: #a9a9a9; font-size: .8rem; }
    footer { margin-top: 32px; color: #707070; font-size: .75rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">The Shaggyverse</div>
    <h1>Shaggy vs Goku</h1>
    <p>One comment. One debate. One answer: Shaggy.</p>
    <figure>
      <img src="screenshot.jpg" alt="Screenshot of a comment thread debating who can defeat Goku, with Shaggy named as the answer.">
      <figcaption>The comment section speaks for itself.</figcaption>
    </figure>
    <footer>Fan-made page · Not affiliated with TikTok, Dragon Ball, or Warner Bros.</footer>
  </main>
</body>
</html>
